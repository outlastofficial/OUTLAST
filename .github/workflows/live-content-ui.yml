name: OUTLAST Live Content UI regression
on:
  push:
    branches: [testing]
    paths:
      - 'live-content-schedule.js'
      - 'tests/live-content-ui.test.js'
      - 'tests/live-content-ui.e2e.cjs'
      - 'index.html'
      - '.github/workflows/live-content-ui.yml'
  pull_request:
    branches: [testing]
    paths:
      - 'live-content-schedule.js'
      - 'tests/live-content-ui.test.js'
      - 'index.html'
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --check live-content-schedule.js
      - run: node --test tests/live-content-ui.test.js
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - run: node tests/live-content-ui.e2e.cjs
      - name: Smoke-test the deployed tester game build
        run: |
          node --input-type=module -e '
          const r = await fetch("https://outlast-test.onrender.com/?live-content-smoke=" + Date.now(), { cache: "no-store" });
          if (!r.ok) throw new Error("Tester site returned " + r.status);
          const h = await r.text();
          const build = (h.match(/<meta name="outlast-build" content="([^"]+)"/) || [])[1];
          if (!build || !h.includes("live-content-schedule.js?v=" + build)) throw new Error("Tester build marker and Live Content schedule reference are not synchronized");
          console.log("Tester game build smoke test passed: " + build);
          '
