name: OUTLAST v3.3 deploy patch
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    if: github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[v3.3 patch]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inject v3.3 reliability layer
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('game.html')
          s=p.read_text(encoding='utf-8')
          tag='<script src="outlast-v3.3.js"></script>'
          if tag not in s:
              marker='</body>'
              if marker in s: s=s.replace(marker,tag+'\n'+marker,1)
              else: s += '\n'+tag+'\n'
          import re
          s=re.sub(r'(<meta[^>]+name=["\']build-version["\'][^>]+content=["\'])[^"\']+(["\'])',r'\g<1>3.3.0\g<2>',s,count=1)
          s=re.sub(r'<title>OUTLAST v[^<]+</title>', '<title>OUTLAST v3.3.0</title>', s,count=1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit patch
        run: |
          git config user.name "OUTLAST Bot"
          git config user.email "outlastofficial@users.noreply.github.com"
          git add game.html outlast-v3.3.js
          git diff --cached --quiet || git commit -m "v3.3.0 reliability and daily challenge [v3.3 patch]"
          git push
