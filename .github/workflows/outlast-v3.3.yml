name: OUTLAST legacy v3.3 compatibility check
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'outlast-v3.3.js'
      - 'outlast-v3.4.js'
      - 'game.html'
      - 'index.html'
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check legacy layer without modifying files
        run: |
          test -f outlast-v3.3.js
          test -f outlast-v3.4.js
          grep -q 'outlast-v3.3.js' game.html
          grep -q 'outlast-v3.4.js' game.html
          echo "Legacy compatibility files present. No auto-rewrite performed."
