name: OUTLAST legacy v3.3/v3.4 syntax compatibility
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'outlast-v3.3.js'
      - 'outlast-v3.4.js'
      - '.github/workflows/outlast-v3.3.yml'
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax-check preserved legacy modules
        run: |
          node --check outlast-v3.3.js
          node --check outlast-v3.4.js
      - name: Verify legacy source files remain available
        run: |
          test -s outlast-v3.3.js
          test -s outlast-v3.4.js
          echo "Legacy v3.3/v3.4 sources remain present and syntactically valid; the current game entry point is not forced to use obsolete loaders."
