name: OUTLAST current critical regression checks
on:
  push:
    branches: ["**"]
    paths:
      - "index.html"
      - "*.js"
      - "tests/**"
      - ".github/workflows/outlast-v3.35.8-check.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Parse all inline browser JavaScript
        run: node tests/inline-script-syntax-v3358.test.js
      - name: Run current v3.37 critical regressions
        run: node tests/v3370-systems.test.js
