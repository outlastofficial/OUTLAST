name: OUTLAST v3.35.8 regression checks
on:
  push:
    branches: ["**"]
    paths:
      - "index.html"
      - "outlast-v33015-upgrade-library.js"
      - "tests/**"
      - ".github/workflows/outlast-v3.35.8-check.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Parse all inline browser JavaScript
        run: node tests/inline-script-syntax-v3358.test.js
      - name: Run critical OUTLAST regression tests
        run: |
          node tests/upgrade-rarity-shield-v3358.test.js
          node tests/upgrade-tree-v3355.test.js
          node tests/boss-bar-v3356.test.js
          node tests/bouncing-bullets-v3350.test.js
          node tests/bouncing-upgrade-luck-v33014.test.js
          node tests/combat-balance-v33017.test.js
          node tests/core-content-v33500.test.js
          node tests/map-layout-v33016.test.js
          node tests/map-scenes-v33013.test.js
          node tests/map-creator-v33018.test.js
