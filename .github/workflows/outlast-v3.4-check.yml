name: OUTLAST v3.4 checks
on:
  push:
    branches: [main]
    paths:
      - 'game.html'
      - 'index.html'
      - 'outlast-v3.4.js'
      - '.github/workflows/outlast-v3.4-check.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  static-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax check client layer
        run: node --check outlast-v3.4.js
      - name: Validate game wiring
        run: |
          test -s game.html
          test -s index.html
          grep -q '<script src="outlast-v3.4.js"></script>' game.html
          grep -q '<script src="outlast-v3.4.js"></script>' index.html
          grep -q '<title>OUTLAST v3.4.0</title>' game.html
          grep -q '<title>OUTLAST v3.4.0</title>' index.html
          ! grep -q '\\g<1>' game.html
          ! grep -q '\\g<2>' game.html
      - name: Validate v3.4 feature markers
        run: |
          grep -q 'OUTLAST v3.4.0' outlast-v3.4.js
          grep -q 'Run Builder' outlast-v3.4.js
          grep -q 'Weapon Mastery' outlast-v3.4.js
          grep -q 'Enemy Codex' outlast-v3.4.js
          grep -q 'Achievements' outlast-v3.4.js
          grep -q 'EXTRACT AT LEVEL 25' outlast-v3.4.js
