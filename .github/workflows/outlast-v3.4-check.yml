name: OUTLAST v3.4 compatibility checks
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'outlast-v3.4.js'
      - '.github/workflows/outlast-v3.4-check.yml'
permissions:
  contents: read
jobs:
  compatibility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax check legacy compatibility layer
        run: node --check outlast-v3.4.js
      - name: Check legacy feature markers
        run: |
          grep -q 'OUTLAST v3.4.0' outlast-v3.4.js
          grep -q 'Run Builder' outlast-v3.4.js
          grep -q 'Weapon Mastery' outlast-v3.4.js
          grep -q 'Enemy Codex' outlast-v3.4.js
          grep -q 'Achievements' outlast-v3.4.js
          grep -q 'EXTRACT AT LEVEL 25' outlast-v3.4.js
