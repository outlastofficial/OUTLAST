name: OUTLAST legacy owner-control module checks
on:
  push:
    branches: [main]
    paths:
      - 'outlast-v3.9.7.js'
      - '.github/workflows/outlast-v3.9.7-check.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check legacy owner-control JavaScript
        run: node --check outlast-v3.9.7.js
      - name: Check preserved legacy feature source
        run: |
          test -s outlast-v3.9.7.js
          grep -q 'OWNER_USERNAMES' outlast-v3.9.7.js
          grep -q 'claimPendingCoins' outlast-v3.9.7.js
          test -s index.html
          echo "Legacy owner-control module syntax and feature markers passed."
