name: Publish OUTLAST v3.0.0

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate v3 build markers
        shell: python
        run: |
          from pathlib import Path
          for name in ("index.html", "game.html"):
              s=Path(name).read_text(encoding="utf-8")
              assert "OUTLAST v3.0.0" in s, f"{name}: missing v3.0.0 marker"
              assert 'content="3.0.0"' in s, f"{name}: missing build version"
              assert "weaponEvolutionsV3" in s, f"{name}: missing v3 evolution system"
              assert "dailyChallengesV3" in s, f"{name}: missing v3 daily challenge system"
          print("OUTLAST v3.0.0 build validation passed.")
