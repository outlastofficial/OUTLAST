name: Publish OUTLAST v2.8.8

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply v2.8.8 public build
        shell: python
        run: |
          from pathlib import Path
          import re

          for name in ("index.html", "game.html"):
              p = Path(name)
              if not p.exists():
                  continue
              s = p.read_text(encoding="utf-8")
              original = s

              # Force the normal in-run boss interval to 90 seconds (1:30).
              s = re.sub(r'(spawnMult:[^\n]*?,bossEvery:)\s*[^,}]+', r'\g<1>90', s, count=1)

              # Make every public version marker in the playable files agree on v2.8.8.
              s = re.sub(r'OUTLAST v[0-9]+\.[0-9]+\.[0-9]+', 'OUTLAST v2.8.8', s)
              s = re.sub(r'v2\.7\.0', 'v2.8.8', s)

              # Prevent stale HTML caching from hiding the new public build.
              if '<meta http-equiv="Cache-Control"' not in s:
                  s = s.replace('<meta name="viewport" content="width=device-width,initial-scale=1">', '<meta name="viewport" content="width=device-width,initial-scale=1">\n<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">\n<meta name="build-version" content="2.8.8">', 1)

              # Put Online / Multiplayer first in the main menu card grid when the exact card exists.
              online = '<div class="menu-card"><h3>Online</h3><button class="menu-btn" id="onlineBtn">Online / Multiplayer</button></div>'
              if online in s:
                  s = s.replace(online, '', 1)
                  first_card = s.find('<div class="menu-card">')
                  if first_card >= 0:
                      s = s[:first_card] + online + s[first_card:]

              # Mobile admin-login fix. iOS Safari can fail to bring up the keyboard or let the
              # dynamically-created password field receive input when touch/pointer handling on
              # the game UI is active. Make the field explicitly interactive and isolate its events.
              marker = 'id="outlast-mobile-admin-input-fix"'
              if marker not in s:
                  mobile_fix = r'''<style id="outlast-mobile-admin-input-fix">
@media (max-width:760px){
  #subPanel #adminPasswordInput{
    display:block!important;
    position:relative!important;
    z-index:9999!important;
    width:100%!important;
    min-height:50px!important;
    box-sizing:border-box!important;
    -webkit-appearance:none!important;
    appearance:none!important;
    -webkit-user-select:text!important;
    user-select:text!important;
    -webkit-touch-callout:default!important;
    touch-action:auto!important;
    pointer-events:auto!important;
    opacity:1!important;
  }
  #subPanel #adminPasswordInput:focus{
    outline:2px solid #69c0ff!important;
    outline-offset:1px!important;
  }
}
</style>'''
                  s = s.replace('</head>', mobile_fix + '\n</head>', 1)

              mobile_script_marker = 'OUTLAST_MOBILE_ADMIN_INPUT_FIX'
              if mobile_script_marker not in s:
                  mobile_script = r'''<script>
/* OUTLAST_MOBILE_ADMIN_INPUT_FIX */
(function(){
  function prepareAdminInput(){
    var input=document.getElementById('adminPasswordInput');
    if(!input)return;
    input.setAttribute('inputmode','text');
    input.setAttribute('autocomplete','current-password');
    input.setAttribute('autocapitalize','none');
    input.setAttribute('autocorrect','off');
    input.setAttribute('spellcheck','false');
    input.style.pointerEvents='auto';
    input.style.touchAction='auto';
    input.style.userSelect='text';
  }
  document.addEventListener('focusin',function(e){
    if(e.target && e.target.id==='adminPasswordInput') prepareAdminInput();
  },true);
  document.addEventListener('touchend',function(e){
    var t=e.target;
    if(t && t.id==='adminPasswordInput'){
      prepareAdminInput();
      setTimeout(function(){try{t.focus();}catch(_){ }},50);
    }
  },true);
  document.addEventListener('pointerdown',function(e){
    if(e.target && e.target.id==='adminPasswordInput'){
      prepareAdminInput();
      e.stopPropagation();
    }
  },true);
  document.addEventListener('keydown',function(e){
    if(e.target && e.target.id==='adminPasswordInput') e.stopPropagation();
  },true);
  var observer=new MutationObserver(function(){
    if(document.getElementById('adminPasswordInput')) prepareAdminInput();
  });
  if(document.body) observer.observe(document.body,{childList:true,subtree:true});
})();
</script>'''
                  s = s.replace('</body>', mobile_script + '\n</body>', 1)

              if s != original:
                  p.write_text(s, encoding="utf-8")

      - name: Commit published build
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html game.html
          if git diff --cached --quiet; then
            echo "No playable-file changes were necessary."
            exit 0
          fi
          git commit -m "Fix mobile admin password input"
          git push
