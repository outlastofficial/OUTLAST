name: Validate OUTLAST v3.9.7

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate current OUTLAST build
        shell: python
        run: |
          from pathlib import Path
          for name in ("index.html", "game.html"):
              html = Path(name).read_text(encoding="utf-8")
              assert "OUTLAST v3.9.7" in html, f"{name}: missing v3.9.7 marker"
              assert 'name="outlast-build" content="3.9.7"' in html, f"{name}: missing build marker"
              assert 'outlast-v3.9.7.js' in html, f"{name}: missing v3.9.7 layer"
              assert len(html) > 1000000, f"{name}: unexpectedly small build"
          print("OUTLAST v3.9.7 validation passed.")
