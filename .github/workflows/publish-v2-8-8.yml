name: Validate OUTLAST v3.1.0

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate v3.1.0 markers and JavaScript
        shell: python
        run: |
          from pathlib import Path
          import re, subprocess

          for name in ("index.html", "game.html"):
              html = Path(name).read_text(encoding="utf-8")
              assert "OUTLAST v3.1.0" in html, f"{name}: missing v3.1.0 marker"
              assert 'content="3.1.0"' in html, f"{name}: missing build version"
              assert "function renderPlayerHub()" in html, f"{name}: missing Player Hub"
              assert "function buildRunSnapshot()" in html, f"{name}: missing Build of the Run"
              scripts = re.findall(r"<script(?:\s[^>]*)?>([\s\S]*?)</script>", html, flags=re.I)
              assert scripts, f"{name}: no script blocks found"
              for i, code in enumerate(scripts, 1):
                  p = Path(f"/tmp/{name}-{i}.js")
                  p.write_text(code, encoding="utf-8")
                  subprocess.run(["node", "--check", str(p)], check=True)

          print("OUTLAST v3.1.0 validation passed.")
