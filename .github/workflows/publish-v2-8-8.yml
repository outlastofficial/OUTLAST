name: Publish OUTLAST v2.8.8

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply v2.8.8 boss timer
        shell: python
        run: |
          from pathlib import Path
          import re

          for name in ("index.html", "game.html"):
              p = Path(name)
              if not p.exists():
                  continue
              s = p.read_text(encoding="utf-8")
              original = s
              # Force the normal in-run boss interval to 90 seconds (1:30).
              s = re.sub(r'(spawnMult:[^\n]*?,bossEvery:)\s*[^,}]+', r'\g<1>90', s, count=1)
              # Mark the public build as v2.8.8 without disturbing historical changelog entries.
              s = re.sub(r'<title>OUTLAST v[0-9.]+</title>', '<title>OUTLAST v2.8.8</title>', s, count=1)
              if s != original:
                  p.write_text(s, encoding="utf-8")

      - name: Commit published build
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html game.html
          if git diff --cached --quiet; then
            echo "No playable-file changes were necessary."
            exit 0
          fi
          git commit -m "Publish OUTLAST v2.8.8 - 90 second bosses"
          git push
