function ensureMegaSave(){
  if(!save||typeof save!=='object')return;
  if(!Array.isArray(save.builderMods))save.builderMods=[];
  if(typeof save.element!=='string'||!elements[save.element])save.element='Fire';
  if(typeof save.activeSkill!=='string'||!activeSkills[save.activeSkill])save.activeSkill='Nova';
  if(typeof save.challengeMode!=='string'||(save.challengeMode!=='None'&&!challengeModes[save.challengeMode]))save.challengeMode='None';
  save.ownedSkills={Nova:true,...(save.ownedSkills||{})};
  if(typeof save.materials!=='number')save.materials=0;
  if(typeof save.keys!=='number')save.keys=0;
  if(typeof save.mythicDust!=='number')save.mythicDust=0;
  if(typeof save.gemsCrafted!=='number')save.gemsCrafted=0;
  if(typeof save.worldEventWins!=='number')save.worldEventWins=0;
  save.records={bestCombo:0,bestDamage:0,bestRunTime:0,totalChests:0,totalCrafted:0,totalDodges:0,...(save.records||{})};
}

let save;

let currentUsername='Player';
function migrateSave(data){
  const base=freshSave();
  if(!data||typeof data!=='object')return base;
  const merged={...base,...data};
  for(const k of ['records','stats','upgrades','skins','pets','relics','charms','titles','weaponLevels','unlockedChars','unlockedWeapons','ach','missionClaimed','ownedSkills']) merged[k]={...base[k],...(data[k]&&typeof data[k]==='object'?data[k]:{})};
  merged.builderMods=Array.isArray(data.builderMods)?data.builderMods.filter(n=>runModifiers[n]&&n!=='None').slice(0,2):[];
  if(!mapDefs[merged.map])merged.map=base.map;
  if(!diffDefs[merged.difficulty])merged.difficulty=base.difficulty;
  if(!modeDefs[merged.mode])merged.mode=base.mode;
  if(!chars[merged.selectedChar])merged.selectedChar=base.selectedChar;
  if(!weapons[merged.selectedWeapon])merged.selectedWeapon=base.selectedWeapon;
  if(!skins[merged.selectedSkin])merged.selectedSkin=base.selectedSkin;
  if(!pets[merged.selectedPet])merged.selectedPet=base.selectedPet;
  if(!relics[merged.selectedRelic])merged.selectedRelic=base.selectedRelic;
  if(!charms[merged.selectedCharm])merged.selectedCharm=base.selectedCharm;
  if(!titles[merged.selectedTitle])merged.selectedTitle=base.selectedTitle;
  if(!runModifiers[merged.selectedModifier])merged.selectedModifier=base.selectedModifier;
  if(!elements[merged.element])merged.element=base.element;

window.buyAllAffordable=()=>{
 let total=0;
 while(true){
  let bought=false;
  for(const [n,,base] of permanent){
   const lv=save.upgrades[n]||0;
   const cost=base*(lv+1);
   if(lv<5&&save.coins>=cost){save.coins-=cost;save.upgrades[n]=lv+1;total++;bought=true;}
  }
  if(!bought) break;
 }
 persist();
 toast(total?`💰 Bought ${total} affordable upgrade level${total===1?'':'s'}!`:'Nothing affordable right now');
 renderUpgradeTree();
};

function useActiveSkill(){
  if(!game.running||game.paused||game.upgradeOpen||!game.player)return;
  const p=game.player, s=p.activeSkill||'Nova', def=activeSkills[s];
  if(!def || p.skillCooldown>0)return;
  if(s==='Nova'){for(let j=game.enemies.length-1;j>=0;j--){const e=game.enemies[j];if(Math.hypot(e.x-p.x,e.y-p.y)<220){damageEnemy(e,p.damage*4);if(e.hp<=0)killEnemy(j)}}game.effects.push({x:p.x,y:p.y,t:.8,r:220});}
  if(s==='Blink'){let dx=(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0),dy=(keys.s||keys.arrowdown?1:0)-(keys.w||keys.arrowup?1:0);if(!dx&&!dy)dy=-1;const l=Math.hypot(dx,dy)||1;p.x=Math.max(30,Math.min(W-30,p.x+dx/l*450));p.y=Math.max(30,Math.min(H-30,p.y+dy/l*450));}
  if(s==='Fortify')p.shield=8;
  if(s==='TimeStop')for(const e of game.enemies)e.slowTimer=5;
  if(s==='Meteor'){for(let j=game.enemies.length-1;j>=0;j--){const e=game.enemies[j];if(Math.random()<.7){damageEnemy(e,p.damage*6);if(e.hp<=0)killEnemy(j)}}}
  p.skillCooldown=def.cool;toast('🌀 '+s+' activated!');
}

function assignSpecialEnemy(e){
  if(!e||e.boss)return;
  const lvl=game.level||1;
  if(lvl<5)return;
  const roll=Math.random();
  if(roll<.035)e.kind='stalker';
  else if(roll<.07)e.kind='shielder';
  else if(roll<.105)e.kind='spitter';
  else if(roll<.135)e.kind='splitter';
  else if(roll<.16)e.kind='reaper';
  else if(roll<.185)e.kind='warden';
  e.abilityClock=2+Math.random()*2;e.shield= e.kind==='shielder'?e.max*.45:0;
  if(e.kind==='stalker'){e.speed*=1.25;e.damage*=.9;}
  if(e.kind==='reaper'){e.speed*=1.55;e.damage*=1.3;e.r=18;}
  if(e.kind==='warden'){e.speed*=.7;e.damage*=1.25;e.max*=1.8;e.hp=e.max;}
}

  if(e.kind==='stalker'&&e.abilityClock<=0){e.speed*=1.35;e.abilityClock=3;}
  if(e.kind==='reaper'&&e.abilityClock<=0&&Math.hypot(p.x-e.x,p.y-e.y)>180){e.x=p.x+(Math.random()-.5)*500;e.y=p.y+(Math.random()-.5)*500;toast('⚠️ Reaper appeared nearby!');e.abilityClock=4;}
  if(e.kind==='warden'&&e.abilityClock<=0){for(const q of game.enemies){if(q!==e&&Math.hypot(q.x-e.x,q.y-e.y)<170)q.speed*=1.12;}e.abilityClock=4;}
  if(e.kind==='splitter'&&e.hp<e.max*.45&&!e.splitDone){e.splitDone=true;for(let k=0;k<2;k++)spawnEnemy('fast');}
  if(e.boss){if(e.hp<e.max*.66&&e.phase<2){e.phase=2;e.speed*=1.2;e.damage*=1.2;toast('👹 Boss Phase 2!');}if(e.hp<e.max*.33&&e.phase<3){e.phase=3;e.speed*=1.35;e.damage*=1.3;e.shoot=.5;toast('💀 Boss Final Phase!');}}
 }
}

const oldUpdate=realUpdate;
update=function(dt){
  oldUpdate(dt);
  if(!game.running||!game.player)return;
  game.eventClock=(game.eventClock||35)-dt;
  if(game.eventClock<=0){runRandomEvent();game.eventClock=45;}
  specialEnemyTick(dt);
  if(game.player.god){game.player.hp=game.player.max;game.player.shield=999;}
  if(save.map==='Subway'&&Math.floor(game.time)%18===0&&Math.abs(game.time-Math.round(game.time))<dt){game.player.hp=Math.max(1,game.player.hp-8);toast('⚡ Subway hazard!');}
  if(game.event==='BLACKOUT')game.player.blackout=1;else game.player.blackout=0;
  /* Extraction unlocks at level 25. */
  if(game.level>=25&&!game.player.extraction){game.player.extraction={x:80+Math.random()*(W-160),y:80+Math.random()*(H-160),charge:0};toast('🚨 EXTRACTION UNLOCKED — Reach the extraction point!');}
  const ex=game.player.extraction;if(ex){const d=Math.hypot(ex.x-game.player.x,ex.y-game.player.y);if(d<75){ex.charge+=dt;if(ex.charge>=3){toast('🚁 EXTRACTION SUCCESSFUL!');endRun(true);}}else ex.charge=Math.max(0,ex.charge-dt*.5);}
  applyBuildSynergy();
};

/* ---------- Score scaling ---------- */
killEnemy=function(i){
 const e=game.enemies[i];if(!e)return;
 const before=game.score;realKillEnemy(i);const gain=Math.max(0,game.score-before);
 let factor=e.boss?.28:e.kind==='elite'?.36:.30;
 game.score=before+gain*factor;
};

/* ---------- Coin economy / daily shop ---------- */
function dailySeed(){return todayKey().split('-').join('').split('').reduce((a,c)=>((a*31)+c.charCodeAt(0))>>>0,7);}
const shopPool=[
 ['core','Forge Core Pack',350,'+3 Forge Cores'],['case','Case Credit',600,'+1 case opening credit'],['xp','XP Token',400,'+1 Forge Core + run XP utility'],
 ['shield','Shield Cell',450,'+1 temporary shield item'],['luck','Lucky Cache',800,'+25 Luck for your next run'],['upgrade','Upgrade Voucher',1200,'+1 level on a random permanent upgrade']
];
function getDailyShop(){let seed=dailySeed(),arr=shopPool.slice(),out=[];while(out.length<4&&arr.length){seed=(seed*1664525+1013904223)>>>0;out.push(arr.splice(seed%arr.length,1)[0]);}return out;}
function nextShopTime(){const d=new Date();return new Date(d.getFullYear(),d.getMonth(),d.getDate()+1,0,0,0).getTime();}
function shopOpen(){
  const key=todayKey();if(save.shopDay!==key){save.shopDay=key;save.shopPurchases={};}
  const items=getDailyShop();
  openSub('🛒 Daily Shop — '+key,'<p class="note">These offers rotate once per day. Next rotation: <b id="shopCountdown">calculating...</b></p><div class="grid">'+items.map(x=>{const bought=!!save.shopPurchases[x[0]];return '<button class="option" data-action="shop" data-value="'+x[0]+'" '+(bought?'disabled':'')+'><b>'+x[1]+'</b><div class="small">'+x[3]+'</div><div class="small">'+(bought?'✅ Purchased today':'🪙 '+x[2])+'</div></button>';}).join('')+'</div>');
  const c=document.getElementById('shopCountdown');if(c){const ms=Math.max(0,nextShopTime()-Date.now()),h=Math.floor(ms/3600000),m=Math.floor(ms/60000)%60;c.textContent=h+'h '+m+'m';}
}
window.buyShop=function(k){const item=getDailyShop().find(x=>x[0]===k);if(!item)return;if(save.shopDay!==todayKey()){save.shopDay=todayKey();save.shopPurchases={};}if(save.shopPurchases[k])return toast('Already purchased today');if(save.coins<item[2])return toast('Not enough coins');save.coins-=item[2];if(k==='core')save.forgeCores+=3;if(k==='case')save.keys++;if(k==='xp')save.forgeCores++;if(k==='shield')save.keys++;if(k==='luck')save.nextRunLuck=(save.nextRunLuck||0)+25;if(k==='upgrade'){const names=permanent.filter(x=>(save.upgrades[x[0]]||0)<5);if(names.length){const n=names[Math.floor(Math.random()*names.length)][0];save.upgrades[n]=(save.upgrades[n]||0)+1;toast('📈 '+n+' upgraded!');}}save.shopPurchases[k]=true;persist();toast('🛒 Purchased '+item[1]+'!');shopOpen();};

/* ---------- Meaningful coin store ---------- */
function openCoinStore(){
 openSub('🪙 Black Market', '<div class="grid">'+
 '<button class="option" data-action="coinbuy" data-value="starter">Emergency Kit<div class="small">2,000 coins — +1 permanent revive token</div></button>'+
 '<button class="option" data-action="coinbuy" data-value="luck">Lucky Permit<div class="small">3,500 coins — +10% rare drop chance</div></button>'+
 '<button class="option" data-action="coinbuy" data-value="mastery">Mastery Core<div class="small">5,000 coins — +1 weapon mastery level</div></button>'+
 '<button class="option" data-action="coinbuy" data-value="cosmetic">Rare Cosmetic Token<div class="small">7,500 coins — unlocks a cosmetic token</div></button>'+
 '</div>');
}

/* ---------- Weekly leaderboard + prizes ---------- */
function weekId(){return weeklyKey();}
function weeklyBoard(){try{return JSON.parse(localStorage.getItem('outlastWeeklyBoard:'+weekId())||'[]')}catch(_){return []}}
function setWeeklyBoard(v){localStorage.setItem('outlastWeeklyBoard:'+weekId(),JSON.stringify(v.slice(0,50)))}
const weeklyPrizes={1:10000,2:7500,3:5000,4:2500,5:2500,6:2500,7:2500,8:2500,9:2500,10:2500,11:1000,12:1000,13:1000,14:1000,15:1000,16:1000,17:1000,18:1000,19:1000,20:1000,21:1000,22:1000,23:1000,24:1000,25:1000};
function renderWeeklyLeaderboard(){const b=weeklyBoard().sort((a,c)=>c.score-a.score);openSub('🏆 Weekly Leaderboard','<p class="note">Week '+weekId()+' • Top 50 qualify for prizes.</p><div class="feature-list">'+(b.length?b.map((x,i)=>'<div class="option"><b>#'+(i+1)+' '+x.name+'</b><div>Score: '+Math.floor(x.score)+' • '+x.kills+' kills • Level '+x.level+'</div><div class="small">Prize: '+(weeklyPrizes[i+1]||0)+' coins'+(i===0?' + 🏆 exclusive trophy/title':i===1||i===2?' + special reward':'')+'</div></div>').join(''):'<div class="option">No scores yet this week.</div>')+'</div><button class="gold" data-action="weeklyClaim">🎁 CLAIM MY WEEKLY PRIZE</button>');}
window.claimWeeklyPrize=function(){const key=weekId(),claimed=save.weeklyPrizeKey===key;if(claimed)return toast('Weekly prize already claimed');const b=weeklyBoard().sort((a,c)=>c.score-a.score),idx=b.findIndex(x=>x.username===currentUsername);if(idx<0)return toast('You have no qualifying weekly score');const place=idx+1,reward=weeklyPrizes[place]||0;if(!reward)return toast('You did not finish in the prize ranks');save.coins+=reward;save.weeklyPrizeKey=key;save.weeklyPrizePlace=place;if(place===1)save.titles.Champion=true;persist();toast('🏆 Weekly prize claimed: +'+reward+' coins!');renderWeeklyLeaderboard();};
function submitWeeklyScore(score){if(!score)return;const b=weeklyBoard().filter(x=>x.username!==currentUsername);b.push({username:currentUsername,name:currentUsername.slice(0,12),score:Math.floor(score),kills:run.kills,level:game.level,date:Date.now()});b.sort((a,c)=>c.score-a.score);setWeeklyBoard(b);}

/* Override endRun to add weekly score, but retain original save/reward flow. */
endRun=function(victory){
  if(!game.running)return;
  const score=game.score;
  realEndRun(victory);
  if(!adminUnlocked&&score>0)submitWeeklyScore(score);
};

/* ---------- Extraction rewards + anti-duplication ---------- */
const oldRealEndRun=realEndRun;
// The wrapper above calls the original endRun, which already prevents duplicate calls by game.running.

/* ---------- Community feedback ---------- */
function feedbackOpen(){openSub('💬 Bug Reports & Update Ideas',
 '<div class="grid"><button class="option" data-action="reportBug">🐛 Report a Bug<div class="small">Earn 1,000 coins after review if valid.</div></button>'+ 
 '<button class="option" data-action="idea">💡 Submit Update Idea<div class="small">Earn 500 coins after review.</div></button></div>'+ 
 '<div class="option"><b>Review policy</b><div class="small">Pending → Accepted/Rejected. Duplicate/fake reports cannot be farmed.</div></div>');}
function reportBugForm(){openSub('🐛 Report a Bug','<input id="fbTitle" placeholder="Bug title" style="width:100%;box-sizing:border-box;padding:10px;margin:5px 0"><textarea id="fbBody" placeholder="What happened? What should have happened?" style="width:100%;min-height:110px;box-sizing:border-box;padding:10px;margin:5px 0"></textarea><button class="gold" data-action="submitBug">SUBMIT BUG REPORT</button>');}
function ideaForm(){openSub('💡 Submit Update Idea','<input id="fbTitle" placeholder="Idea title" style="width:100%;box-sizing:border-box;padding:10px;margin:5px 0"><textarea id="fbBody" placeholder="Describe your idea" style="width:100%;min-height:110px;box-sizing:border-box;padding:10px;margin:5px 0"></textarea><button class="gold" data-action="submitIdea">SUBMIT IDEA</button>');}
function storeFeedback(type){const title=(document.getElementById('fbTitle').value||'').trim().slice(0,80),body=(document.getElementById('fbBody').value||'').trim().slice(0,1000);if(title.length<3||body.length<5)return toast('Please provide more detail');const arr=JSON.parse(localStorage.getItem('outlastFeedback')||'[]');if(arr.some(x=>x.user===currentUsername&&x.type===type&&x.title.toLowerCase()===title.toLowerCase()))return toast('Duplicate submission blocked');arr.push({id:Date.now()+Math.random(),user:currentUsername,type,title,body,status:'Pending',reward:0,date:Date.now()});localStorage.setItem('outlastFeedback',JSON.stringify(arr));toast('📨 Submitted for review');feedbackOpen();}

/* ---------- Better settings ---------- */
function settingsOpen(){openSub('⚙️ Settings','<div class="grid">'+
 '<button class="option" data-action="toggleSetting" data-value="shake">Screen Shake: '+(save.settings?.shake!==false?'ON':'OFF')+'</button>'+ 
 '<button class="option" data-action="toggleSetting" data-value="damageNumbers">Damage Numbers: '+(save.settings?.damageNumbers!==false?'ON':'OFF')+'</button>'+ 
 '<button class="option" data-action="toggleSetting" data-value="autoPause">Auto-Pause: '+(save.settings?.autoPause!==false?'ON':'OFF')+'</button>'+ 
 '<button class="option" data-action="fullscreen">🖥️ Toggle Fullscreen</button>'+ 
 '<button class="option" data-action="resetSettings">↩️ Reset Settings</button></div>');}

/* ---------- Event action router for all added UI ---------- */
document.getElementById('subContent').addEventListener('click',e=>{
 const b=e.target.closest('button[data-action]');if(!b)return;const a=b.dataset.action,v=b.dataset.value;
 if(a==='adminLogin')adminLogin();
 else if(a==='adminXP')adminXP(v); else if(a==='adminLevel')adminLevel(v); else if(a==='adminCoins')adminCoins(v); else if(a==='adminUnlock')adminUnlock();else if(a==='adminStats')adminStats();else if(a==='adminDaily')adminDaily();else if(a==='adminLeaderboard')adminLeaderboard();else if(a==='adminGod')adminGod();else if(a==='adminInfinite')adminInfinite();else if(a==='adminPrestige')adminPrestige();else if(a==='adminQuests')adminQuests();else if(a==='adminSkillTree')adminSkillTree();else if(a==='adminSpawnBoss')adminSpawnBoss();else if(a==='adminSpawnElite')adminSpawnElite();else if(a==='adminSpawnZombie')adminSpawnZombie();else if(a==='adminSpawnLoot')adminSpawnLoot();else if(a==='adminWave')adminWave();else if(a==='adminReset')adminReset();else if(a==='adminLock')adminLock();
 else if(a==='shop')buyShop(v); else if(a==='coinbuy'){if(!save.coinPurchases)save.coinPurchases={};const costs={starter:2000,luck:3500,mastery:5000,cosmetic:7500};if(save.coinPurchases[v])return toast('Already purchased');if(save.coins<costs[v])return toast('Not enough coins');save.coins-=costs[v];save.coinPurchases[v]=true;if(v==='starter')save.reviveTokens=(save.reviveTokens||0)+1;if(v==='luck')save.permanentLuck=(save.permanentLuck||0)+10;if(v==='mastery')save.masteryCores=(save.masteryCores||0)+1;if(v==='cosmetic')save.cosmeticTokens=(save.cosmeticTokens||0)+1;persist();toast('🪙 Purchase complete');openCoinStore();}
 else if(a==='weeklyClaim')claimWeeklyPrize();else if(a==='reportBug')reportBugForm();else if(a==='idea')ideaForm();else if(a==='submitBug')storeFeedback('bug');else if(a==='submitIdea')storeFeedback('idea');
 else if(a==='toggleSetting'){save.settings=save.settings||{};save.settings[v]=save.settings[v]===false?true:false;persist();settingsOpen();}
 else if(a==='fullscreen'){if(document.fullscreenElement)document.exitFullscreen?.();else document.documentElement.requestFullscreen?.();}
 else if(a==='resetSettings'){save.settings={shake:true,damageNumbers:true,autoPause:true};persist();settingsOpen();}
 else if(a==='map')selectMap(v);
 else if(a==='weapon')selectWeapon(v);
});

/* ---------- Add new menu buttons ---------- */
function addMenuButton(id,text,fn){if(document.getElementById(id))return;const b=document.createElement('button');b.id=id;b.className='menu-btn';b.textContent=text;b.onclick=fn;const anchor=document.getElementById('recordsBtn')||document.getElementById('worldBtn')||document.querySelector('.menu-btn');(anchor?.parentElement||document.body).appendChild(b);}
addMenuButton('weeklyBoardBtn','🏆 WEEKLY LEADERBOARD',renderWeeklyLeaderboard);
addMenuButton('feedbackBtn','💬 BUGS & IDEAS',feedbackOpen);
addMenuButton('coinStoreBtn','🪙 BLACK MARKET',openCoinStore);
addMenuButton('settingsNewBtn','⚙️ SETTINGS',settingsOpen);

/* ---------- Visual health bar, extraction marker, map/event overlays ---------- */
const oldDraw=draw;
draw=function(){
 oldDraw();
 if(!game.running||!game.player)return;
 const p=game.player,[sx,sy]=worldPoint(p.x,p.y);const bw=90,bh=9;ctx.fillStyle='rgba(0,0,0,.75)';ctx.fillRect(sx-bw/2,sy-42,bw,bh);ctx.fillStyle='#55df72';ctx.fillRect(sx-bw/2,sy-42,bw*Math.max(0,p.hp/p.max),bh);ctx.strokeStyle='#fff';ctx.strokeRect(sx-bw/2,sy-42,bw,bh);ctx.fillStyle='#fff';ctx.font='11px Arial';ctx.textAlign='center';ctx.fillText(Math.ceil(p.hp)+' / '+Math.ceil(p.max),sx,sy-47);ctx.textAlign='left';
 if(p.extraction){const [ex,ey]=worldPoint(p.extraction.x,p.extraction.y);ctx.strokeStyle='#6fffd1';ctx.lineWidth=5;ctx.beginPath();ctx.arc(ex,ey,35,0,Math.PI*2);ctx.stroke();ctx.fillStyle='#6fffd1';ctx.font='bold 13px Arial';ctx.textAlign='center';ctx.fillText(p.extraction.charge>0?'EXTRACTING...':'EXTRACTION',ex,ey-45);ctx.textAlign='left';}
 if(game.eventTimer>0){ctx.fillStyle='#fff';ctx.font='bold 20px Arial';ctx.textAlign='center';ctx.fillText('EVENT: '+game.event+'  '+Math.ceil(game.eventTimer)+'s',CW/2,32);ctx.textAlign='left';}
 if(p.blackout){ctx.fillStyle='rgba(0,0,0,.82)';ctx.fillRect(0,0,CW,CH);ctx.save();ctx.globalCompositeOperation='destination-out';ctx.beginPath();ctx.arc(sx,sy,150,0,Math.PI*2);ctx.fill();ctx.restore();}
 if(save.map==='Forest'){ctx.fillStyle='rgba(0,0,0,.18)';ctx.fillRect(0,0,CW,CH);}
};

/* Special enemy labels are drawn by a light overlay after the base draw. */
const oldDraw2=draw;
draw=function(){oldDraw2();if(!game.running)return;for(const e of game.enemies){if(['stalker','shielder','spitter','splitter','reaper','warden'].includes(e.kind)){const [x,y]=worldPoint(e.x,e.y);ctx.fillStyle='#fff';ctx.font='10px Arial';ctx.textAlign='center';ctx.fillText(e.kind.toUpperCase(),x,y-e.r-14);ctx.textAlign='left';}}};

if(!save.settings)save.settings={shake:true,damageNumbers:true,autoPause:true};
